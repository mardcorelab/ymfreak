# Runs on every push: installs, type-checks, lints, tests the business rules,
# builds the database on a real Postgres (with constraints + seed) and builds the app.
name: CI
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ymfreak
          POSTGRES_PASSWORD: ymfreak
          POSTGRES_DB: ymfreak
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ymfreak" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ymfreak:ymfreak@localhost:5432/ymfreak
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc }
      # No lockfile yet (Phase 0 was written without registry access); see README.
      - run: npm install --no-audit --no-fund
      - run: npx prisma validate
      - run: npx prisma generate
      - run: scripts/ci-run.sh typecheck npm run typecheck
        continue-on-error: true
      - run: scripts/ci-run.sh lint npm run lint
        continue-on-error: true
      - run: scripts/ci-run.sh test npm test
        continue-on-error: true
      # Until the first migration is committed, push the schema directly.
      - run: if [ -d prisma/migrations ]; then npx prisma migrate deploy; else npx prisma db push --skip-generate; fi
      - run: scripts/ci-run.sh constraints npm run db:constraints
      - run: scripts/ci-run.sh seed npm run db:seed
      - run: npm run db:seed # second run must be a no-op
      - run: scripts/ci-run.sh build npm run build
