# Runs on every push: installs, type-checks, lints, tests the business rules,
# builds the database on a real Postgres (with constraints + seed) and builds the app.
name: CI
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ymfreak
          POSTGRES_PASSWORD: ymfreak
          POSTGRES_DB: ymfreak
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ymfreak" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ymfreak:ymfreak@localhost:5432/ymfreak
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # Test-only admin credentials for the end-to-end run.
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-only-test-password-123
      # Swaps PayPal for an in-process test double (never possible on Vercel).
      PAYMENTS_TEST_MODE: "1"
      # Scripted stand-in for Claude so the assistant's tools are tested without an API key.
      AGENT_TEST_MODE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with: { node-version-file: .nvmrc }
      # No lockfile yet (Phase 0 was written without registry access); see README.
      - run: npm install --no-audit --no-fund
      - run: npx prisma validate
      - run: npx prisma generate
      - run: scripts/ci-run.sh typecheck npm run typecheck
      - run: scripts/ci-run.sh lint npm run lint
      - run: scripts/ci-run.sh test npm test
      # Same database setup Vercel runs on every deploy (schema, constraints, seed).
      - run: scripts/ci-run.sh db-setup npx tsx scripts/db-setup.ts
      - run: npx tsx scripts/db-setup.ts # second run must be a no-op
      - run: scripts/ci-run.sh build npm run build
      - run: npx playwright install --with-deps chromium
      - name: End-to-end (dashboard → public site)
        run: |
          npx next start -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/es > /dev/null && break; sleep 1; done
          scripts/ci-run.sh e2e npx playwright test || { tail -50 /tmp/next.log | sed 's/^/::error title=server::/'; exit 1; }
